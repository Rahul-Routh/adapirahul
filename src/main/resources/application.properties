spring.application.name=adapirahul

# Dynamic port for local testing (defaults to 8080) and cloud hosting (Render binds $PORT)
server.port=${PORT:8080}

# In-memory H2 Database configuration
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically create and update database tables from JPA entities
spring.jpa.hibernate.ddl-auto=update

# Optional: View SQL queries in console for debugging
spring.jpa.show-sql=true

# Optional: Enable web console to view database tables at http://localhost:8080/h2-console
spring.h2.console.enabled=true