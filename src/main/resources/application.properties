spring.application.name=adapirahul

# Dynamic port: Render automatically sets $PORT in the cloud, falls back to 8080 locally
server.port=${PORT:8080}

# Read database settings from environment variables (falls back to H2 for local testing)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate configuration (auto-creates tables in both H2 and PostgreSQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 console for local debugging (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true